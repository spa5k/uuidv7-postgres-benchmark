[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uuidv7-postgres-benchmark"
version = "0.1.0"
description = "Professional PostgreSQL UUIDv7 benchmarking suite"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.1.0",
    "pandas>=2.0.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["venv"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = [
    "results",
    "venv",
    ".venv",
]

